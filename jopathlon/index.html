<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jopathlon: do a triathlon, play golf, drink beer, and add up your time."
    />
    <meta name="theme-color" content="#28333b" />
    <link rel="canonical" href="https://jopathlon.jopism.com/" />
    <link rel="icon" href="triathlon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>Jopathlon — Triathlon. Golf. Beer.</title>
  </head>
  <body>
    <a class="skip-link" href="#how-it-works">Skip to how it works</a>

    <header class="hero">
      <div class="hero__geometry" aria-hidden="true"></div>
      <div class="hero__content">
        <p class="wordmark">Jopathlon</p>
        <h1>Triathlon. <span>Golf.</span> Beer.</h1>
        <img
          class="hero__illustration"
          src="triathlon.svg"
          alt="Illustration of a swimmer, cyclist, and runner"
          width="900"
          height="280"
        />
      </div>
    </header>

    <main id="how-it-works" class="how-it-works">
      <div class="how-it-works__content">
        <p class="eyebrow">The idea</p>
        <h2>How it works</h2>
        <ol class="steps">
          <li>
            <span class="step-number" aria-hidden="true">01</span>
            <span>Do a triathlon.</span>
          </li>
          <li>
            <span class="step-number" aria-hidden="true">02</span>
            <span>Play golf—your score adds to or subtracts from your triathlon time.</span>
          </li>
          <li>
            <span class="step-number" aria-hidden="true">03</span>
            <span>Drink beer—your beers add to or subtract from your triathlon time.</span>
          </li>
          <li>
            <span class="step-number" aria-hidden="true">04</span>
            <span>Add up your time.</span>
          </li>
        </ol>
      </div>
    </main>

    <footer class="site-footer">
      <a href="https://jopism.com/">Part of Jopism</a>
    </footer>
  </body>
</html>
