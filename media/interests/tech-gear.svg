<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Tech and smart home gear: laptop, phone, wifi signal" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Smart home and tech gear</title>
  <defs>
    <mask id="tech-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <rect width="200" height="200" fill="#fff"/>
      <rect x="46" y="94" width="68" height="40" rx="3" fill="#000"/>
      <rect x="148" y="108" width="16" height="32" rx="3" fill="#000"/>
    </mask>
  </defs>
  <g fill="#b8c99a">
