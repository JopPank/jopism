<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Kitchen gear: chef's knife and kettle grill" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Kitchen gear</title>
  <defs>
    <mask id="kit-grill" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <rect width="200" height="200" fill="#fff"/>
      <rect x="80" y="113" width="96" height="4" fill="#000"/>
      <circle cx="128" cy="92" r="4" fill="#000"/>
    </mask>
    <mask id="kit-knife" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <rect width="200" height="200" fill="#fff"/>
      <circle cx="51" cy="132" r="3" fill="#000"/>
      <circle cx="51" cy="148" r="3" fill="#000"/>
    </mask>
  </defs>
  <g fill="#b8c99a">
    <rect x="8" y="8" width="184" height="184" rx="24" fill="none" stroke="#b8c99a" stroke-width="10"/>
    <!-- chef's knife -->
    <g transform="rotate(16 52 110)" mask="url(#kit-knife)">
      <path d="M62 34 L62 108 H34 Q34 86 42 66 Q50 48 62 34 Z"/>
      <rect x="38" y="108" width="26" height="7" rx="3"/>
      <rect x="41" y="114" width="20" height="52" rx="8"/>
    </g>
    <!-- kettle grill -->
    <g mask="url(#kit-grill)">
      <path d="M88 112 A40 40 0 0 1 168 112 Z"/>
      <rect x="116" y="68" width="24" height="8" rx="4"/>
      <path d="M90 118 H166 Q166 152 128 152 Q90 152 90 118 Z"/>
    </g>
    <g stroke="#b8c99a" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M108 148 L100 176"/>
      <path d="M148 148 L156 176"/>
    </g>
  </g>
</svg>
