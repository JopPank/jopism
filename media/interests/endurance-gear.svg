    <g mask="url(#tri-cut)">
      <ellipse cx="80" cy="50" rx="23" ry="15"/>
      <ellipse cx="120" cy="50" rx="23" ry="15"/>
      <rect x="95" y="46" width="10" height="8" rx="3"/>
      <path d="M58 46 C50 44 44 48 42 55" fill="none" stroke="#b8c99a" stroke-width="6" stroke-linecap="round"/>
      <path d="M142 46 C150 44 156 48 158 55" fill="none" stroke="#b8c99a" stroke-width="6" stroke-linecap="round"/>
    </g>
    <!-- bike -->
    <g fill="none" stroke="#b8c99a" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="44" cy="140" r="18" stroke-width="7"/>
      <circle cx="98" cy="140" r="18" stroke-width="7"/>
      <path d="M44 140 L62 112 L90 112 L98 140 M44 140 L68 140 L62 112 M68 140 L90 112" stroke-width="6"/>
      <path d="M90 112 L92 100 H100" stroke-width="6"/>
