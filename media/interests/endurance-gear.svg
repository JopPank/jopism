<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Endurance gear: swim goggles, bike, running figure" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Endurance gear</title>
  <defs>
    <mask id="tri-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <rect width="200" height="200" fill="#fff"/>
      <ellipse cx="80" cy="50" rx="13" ry="7" fill="#000"/>
      <ellipse cx="120" cy="50" rx="13" ry="7" fill="#000"/>
    </mask>
  </defs>
  <g fill="#b8c99a" stroke="none">
    <rect x="8" y="8" width="184" height="184" rx="24" fill="none" stroke="#b8c99a" stroke-width="10"/>
