<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Golf gear: golf bag with clubs and a ball on a tee" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Golf gear</title>
  <defs>
    <mask id="golf-bag" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <rect width="200" height="200" fill="#fff"/>
      <g stroke="#000" stroke-width="4" stroke-linecap="round" fill="none">
        <path d="M70 112 L96 152"/>
        <path d="M104 126 V148"/>
      </g>
    </mask>
    <mask id="golf-ball" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <rect width="200" height="200" fill="#fff"/>
      <circle cx="143" cy="133" r="2.6" fill="#000"/>
      <circle cx="152" cy="138" r="2.6" fill="#000"/>
      <circle cx="144" cy="143" r="2.6" fill="#000"/>
    </mask>
  </defs>
  <g fill="#b8c99a">
    <rect x="8" y="8" width="184" height="184" rx="24" fill="none" stroke="#b8c99a" stroke-width="10"/>
    <g transform="rotate(-8 82 120)" mask="url(#golf-bag)">
      <g stroke="#b8c99a" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M70 92 L60 44"/>
        <path d="M84 92 L86 38"/>
        <path d="M98 92 L110 46"/>
      </g>
      <!-- driver -->
      <ellipse cx="57" cy="38" rx="13" ry="9" transform="rotate(-20 57 38)"/>
      <!-- iron -->
      <path d="M76 24 H98 Q101 24 101 27 V35 Q101 38 98 38 H76 Z" transform="rotate(4 88 31)"/>
      <!-- putter -->
      <rect x="104" y="38" width="24" height="9" rx="3" transform="rotate(-16 116 42)"/>
      <!-- bag -->
      <rect x="54" y="86" width="60" height="13" rx="6.5"/>
      <path d="M58 96 H110 L104 160 Q103 168 95 168 H73 Q65 168 64 160 Z"/>
      <rect x="102" y="116" width="16" height="40" rx="7"/>
      <rect x="62" y="162" width="44" height="9" rx="4.5"/>
    </g>
    <!-- ball on tee -->
    <g mask="url(#golf-ball)">
      <circle cx="148" cy="137" r="14"/>
    </g>
    <path d="M138 153 H158 L153 161 H143 Z"/>
    <rect x="146" y="159" width="4" height="12" rx="2"/>
  </g>
</svg>
